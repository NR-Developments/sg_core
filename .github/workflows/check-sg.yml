name: SG integration checks
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua runtime for structural and contract checks
        run: sudo apt-get update && sudo apt-get install -y liblua5.4-0
      - name: Test canonical core and adapters
        run: python3 tools/test_core.py
      - name: Audit declared runtime scripts and default startup
        run: python3 tools/audit_resources.py
